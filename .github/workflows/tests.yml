name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package, GNN and test dependencies
        run: python -m pip install -e ".[dev,ml]"
      - name: Compile all Python modules
        run: python -m compileall -q src simulation sdn scripts
      - name: Run full offline synthetic pipeline (baseline, GCN, GAT)
        run: python scripts/run_demo.py --output-dir /tmp/gnn-sdn-apt-demo --with-gnn --epochs 2
      - name: Run unit and regression tests
        run: pytest -q
